name = "ai-receptionist"
main = "workers/api.js"
compatibility_date = "2024-01-01"

[env.production]
name = "ai-receptionist-prod"

vars = [
  { name = "APP_BASE_URL", value = "https://edge.brandverse.tech" },
  { name = "APP_SUBDOMAIN", value = "edge.brandverse.tech" },
  { name = "DEFAULT_TIMEZONE", value = "Australia/Melbourne" }
]

# Required secrets (set via dashboard or wrangler secret):
#   wrangler secret put GOOGLE_CLIENT_EMAIL --env production
#   wrangler secret put GOOGLE_PRIVATE_KEY --env production
#
# Required for security (fail-closed if missing):
#   wrangler secret put WORKER_HMAC_SECRET --env production
#     Signs the per-client tokens embedded in Vapi assistant tool URLs.
#     Without it every /api/{clientId}/* route returns 503.
#   wrangler secret put VAPI_WEBHOOK_SECRET --env production
#     Mirror this exact value in the Vapi dashboard (Webhook Secret).
#     Without it /api/vapi/webhook returns 503 (fail closed, never open).
#
# Optional secrets (for booking email notifications via Google Apps Script):
#   wrangler secret put GOOGLE_APPS_SCRIPT_WEBHOOK_URL --env production
#   wrangler secret put GOOGLE_APPS_SCRIPT_SECRET --env production
#
# Vapi (for outbound calls):
#   wrangler secret put VAPI_API_KEY --env production
#
# Client config override (JSON string, optional — falls back to embedded config):
#   wrangler secret put CLIENTS_CONFIG --env production

[env.staging]
name = "ai-receptionist-staging"

vars = [
  { name = "APP_BASE_URL", value = "https://staging-edge.brandverse.tech" },
  { name = "APP_SUBDOMAIN", value = "staging-edge.brandverse.tech" },
  { name = "DEFAULT_TIMEZONE", value = "Australia/Melbourne" }
]

# Routes
[[env.production.routes]]
pattern = "edge.brandverse.tech/api/*"
zone_name = "brandverse.tech"

[[env.production.routes]]
pattern = "edge.brandverse.tech/health"
zone_name = "brandverse.tech"

[[env.staging.routes]]
pattern = "staging-edge.brandverse.tech/api/*"
zone_name = "brandverse.tech"

[[env.staging.routes]]
pattern = "staging-edge.brandverse.tech/health"
zone_name = "brandverse.tech"